unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf

bind . command-prompt -p "Rename session:" -I "#{s/^[0-9]+-//:session_name}" "run-shell -b '~/.config/tmux/scripts/rename_session_prompt.sh #{q:1} #{q:session_id}' \"%%%\""

bind h split-window -hb -c "#{pane_current_path}"
bind j split-window -v -c "#{pane_current_path}"
bind k split-window -vb -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"

bind-key -n -r C-S-h resize-pane -L 5
bind-key -n -r C-S-j resize-pane -D 5
bind-key -n -r C-S-k resize-pane -U 5
bind-key -n -r C-S-l resize-pane -R 5

bind-key -n C-f resize-pane -Z
bind-key -n F11 next-window
bind-key -n C-o new-window -c "#{pane_current_path}"
bind-key -n C-q kill-window
bind-key -n C-v copy-mode
bind-key -n S-F11 detach-client

set -g mouse on
set -g mode-keys vi
# Status
set -g status-interval 60
# Terminal colors
set -s terminal-features[100] '*:RGB:usstyle'

# Clipboard
set -g allow-passthrough on

# Enable CSI u
set -g extended-keys on
set -s terminal-features[101] 'xterm*:extkeys'

# Enable focus events
set -g focus-events on

# Enable gapeless window
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# History buffer size
set -g history-limit 100000

### Plugins
source-file ~/.config/tmux/plugins.conf

set -g @resurrect-capture-pane-contents 'on'
# The startup wrapper owns restore completion, including skipped restores.
set -g @continuum-restore 'off'
set -g @resurrect-hook-pre-restore-all '~/.config/tmux/scripts/session_manager.py restore-begin'
set -g @resurrect-hook-post-restore-all '~/.config/tmux/scripts/session_manager.py restore-end'
run-shell '~/.config/tmux/scripts/session_manager.py startup-prepare'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_number_color '#{@thm_blue}'
set -g @catppuccin_window_current_number_color '#{@thm_peach}'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #{s|.*/([^/]*/[^/]*)$|\1|:pane_current_path}'
# Set before TPM runs so tmux-continuum can prepend its save hook.
set -g status-right '#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}'
run '~/.tmux/plugins/tpm/tpm' # Initialize TPM

set -g status-left-length 400
set -g status-left "#(~/.config/tmux/tmux-status/left.sh '#{session_id}' '#{client_width}') "

set-hook -g client-attached[100] 'refresh-client -S'
set-hook -g client-resized[100] 'refresh-client -S'
set-hook -g client-session-changed[100] 'refresh-client -S'

set-hook -g session-created[100] 'run-shell -b "~/.config/tmux/scripts/session_created.sh"'
set-hook -g session-closed[100] 'run-shell -b "~/.config/tmux/scripts/session_manager.py ensure"'
run-shell -b "~/.config/tmux/scripts/startup_restore.sh"

bind 1 run-shell -b "~/.config/tmux/scripts/move_window_to_session.sh 1 '#{session_id}' '#{window_id}' '#{client_name}'"
bind 2 run-shell -b "~/.config/tmux/scripts/move_window_to_session.sh 2 '#{session_id}' '#{window_id}' '#{client_name}'"
bind 3 run-shell -b "~/.config/tmux/scripts/move_window_to_session.sh 3 '#{session_id}' '#{window_id}' '#{client_name}'"
bind 4 run-shell -b "~/.config/tmux/scripts/move_window_to_session.sh 4 '#{session_id}' '#{window_id}' '#{client_name}'"
bind 5 run-shell -b "~/.config/tmux/scripts/move_window_to_session.sh 5 '#{session_id}' '#{window_id}' '#{client_name}'"
bind 6 run-shell -b "~/.config/tmux/scripts/move_window_to_session.sh 6 '#{session_id}' '#{window_id}' '#{client_name}'"
bind 7 run-shell -b "~/.config/tmux/scripts/move_window_to_session.sh 7 '#{session_id}' '#{window_id}' '#{client_name}'"
bind 8 run-shell -b "~/.config/tmux/scripts/move_window_to_session.sh 8 '#{session_id}' '#{window_id}' '#{client_name}'"
bind 9 run-shell -b "~/.config/tmux/scripts/move_window_to_session.sh 9 '#{session_id}' '#{window_id}' '#{client_name}'"
bind 0 run-shell -b "~/.config/tmux/scripts/move_window_to_session.sh 10 '#{session_id}' '#{window_id}' '#{client_name}'"

bind-key -n C-s run-shell -b "~/.config/tmux/scripts/new_session.sh '#{client_name}'"

bind-key -n C-1 select-window -t 1
bind-key -n C-2 select-window -t 2
bind-key -n C-3 select-window -t 3
bind-key -n C-4 select-window -t 4
bind-key -n C-5 select-window -t 5
bind-key -n C-6 select-window -t 6
bind-key -n C-7 select-window -t 7
bind-key -n C-8 select-window -t 8
bind-key -n C-9 select-window -t 9

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Slots are named N-label, so a 'N-' prefix target resolves natively (1- does
# not match 10-x). The guard keeps a missing slot from flashing an error.
bind-key -n F1 if-shell -F '#{S:#{?#{m/r:^1-,#{session_name}},1,}}' 'switch-client -t 1-'
bind-key -n F2 if-shell -F '#{S:#{?#{m/r:^2-,#{session_name}},1,}}' 'switch-client -t 2-'
bind-key -n F3 if-shell -F '#{S:#{?#{m/r:^3-,#{session_name}},1,}}' 'switch-client -t 3-'
bind-key -n F4 if-shell -F '#{S:#{?#{m/r:^4-,#{session_name}},1,}}' 'switch-client -t 4-'
bind-key -n F5 if-shell -F '#{S:#{?#{m/r:^5-,#{session_name}},1,}}' 'switch-client -t 5-'
bind-key -n F6 if-shell -F '#{S:#{?#{m/r:^6-,#{session_name}},1,}}' 'switch-client -t 6-'
bind-key -n F7 if-shell -F '#{S:#{?#{m/r:^7-,#{session_name}},1,}}' 'switch-client -t 7-'
bind-key -n F8 if-shell -F '#{S:#{?#{m/r:^8-,#{session_name}},1,}}' 'switch-client -t 8-'
bind-key -n F9 if-shell -F '#{S:#{?#{m/r:^9-,#{session_name}},1,}}' 'switch-client -t 9-'
bind-key -n F10 if-shell -F '#{S:#{?#{m/r:^10-,#{session_name}},1,}}' 'switch-client -t 10-'

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy_to_clipboard.sh"
